<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Publications — Mao Nishino</title>
  <meta name="description" content="Publications by Mao Nishino, synced from SerpAPI (Google Scholar Author), with OpenAlex and Scholar options." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/favicon.svg" />
  <link rel="stylesheet" href="assets/styles.css" />
</head>
<body>
  <header class="site-header glass">
    <div class="container header-inner">
      <a href="index.html" class="brand">
        <img src="assets/logo.svg" alt="" class="brand-mark" />
        <span class="brand-name">Mao&nbsp;Nishino</span>
      </a>
      <nav class="nav">
        <a href="index.html" class="nav-link" data-i18n="nav.home">Home</a>
        <a href="publications.html" class="nav-link active" data-i18n="nav.publications">Publications</a>
        <a href="projects.html" class="nav-link" data-i18n="nav.projects">Projects</a>
      </nav>
      <div class="header-cta-wrap">
        <button id="langToggle" class="lang-toggle" type="button" aria-label="Language">JP / EN</button>
        <a class="cta" href="mailto:mnishino@fsu.edu" data-i18n="nav.contact">Contact</a>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="page-header">
      <h1 class="page-title" data-i18n="pub.page_title">Publications</h1>
      <p class="muted" data-i18n="pub.subtitle">This list syncs automatically from SerpAPI (Google Scholar Author), with OpenAlex and direct Scholar as fallbacks.</p>
      <div id="pub-last-updated" class="muted small"></div>
    </section>

    <section class="toolbar">
      <input id="search" type="search" data-i18n="pub.toolbar.search_placeholder" data-i18n-attr="placeholder" placeholder="Search title, author, venue…" />
      <label class="control">
        <span data-i18n="pub.toolbar.sort_label">Sort by</span>
        <select id="sort">
          <option value="year-desc" data-i18n="pub.toolbar.sort.year_desc">Year (new → old)</option>
          <option value="year-asc" data-i18n="pub.toolbar.sort.year_asc">Year (old → new)</option>
          <option value="cites-desc" data-i18n="pub.toolbar.sort.cites_desc">Citations (high → low)</option>
          <option value="cites-asc" data-i18n="pub.toolbar.sort.cites_asc">Citations (low → high)</option>
          <option value="title-asc" data-i18n="pub.toolbar.sort.title_asc">Title (A → Z)</option>
          <option value="title-desc" data-i18n="pub.toolbar.sort.title_desc">Title (Z → A)</option>
        </select>
      </label>
      <label class="switch">
        <input id="groupByYear" type="checkbox" checked>
        <span data-i18n="pub.toolbar.group_by_year">Group by year</span>
      </label>
    </section>

    <section id="pub-list" class="pub-list"></section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© <span id="year"></span> Mao Nishino.</p>
    </div>
  </footer>

  <script src="assets/main.js" defer></script>
  <script src="assets/publications.js" defer></script>
</body>
</html>
