name: Update publications (Google Scholar)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"  # every Monday 06:00 UTC
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/update-publications.yml"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm i

      - name: Fetch Google Scholar publications
        env:
          SCHOLAR_ID: ${{ secrets.SCHOLAR_ID }}
        run: npm run fetch:scholar

      - name: Commit and push changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/publications.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update publications.json from Google Scholar"
            git push
          fi
