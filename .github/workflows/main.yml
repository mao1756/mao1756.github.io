name: Update publications

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Source: serpapi (default), openalex, or scholar"
        required: false
        default: "serpapi"
  schedule:
    - cron: "0 6 * * 1"  # every Monday 06:00 UTC
  push:
    paths:
      - "scripts/**"
      - ".github/workflows/update-publications.yml"

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm i

      - name: Fetch publications (SerpAPI default)
        env:
          SOURCE: ${{ github.event.inputs.source || 'serpapi' }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SCHOLAR_ID: ${{ secrets.SCHOLAR_ID }}
          OPENALEX_AUTHOR_ID: ${{ secrets.OPENALEX_AUTHOR_ID }}
          OPENALEX_QUERY: ${{ secrets.OPENALEX_QUERY }}
        run: |
          if [ "$SOURCE" = "openalex" ]; then
            npm run fetch:openalex
          elif [ "$SOURCE" = "scholar" ]; then
            npm run fetch:scholar
          else
            npm run fetch:serpapi
          fi

      - name: Commit and push changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/publications.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update publications.json"
            git push
          fi
